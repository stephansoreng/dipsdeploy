name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to gh-pages
        run: git push origin HEAD:gh-pages --force

  deploy-hnikt:
    if: github.repository == 'stephansoreng/dipsdeploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to HNIKT gh-pages
        run: |
          git remote add hnikt https://x-access-token:${{ secrets.HNIKT_PAT }}@github.com/HNIKT/PERSONLIG-StephanKristiansen-Sandbox.git
          git push hnikt HEAD:gh-pages --force
